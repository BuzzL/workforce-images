name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests (offline)
        run: python3 -m unittest discover -s scripts -v
      # Live check that every vendor source still answers in the expected
      # format. Proposes nothing and writes nothing.
      - name: Dry run against live sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/bump_pins.py --list --min-age-days 7

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # actionlint runs shellcheck on every run: block.
      - name: Lint the publish and CI workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint .github/workflows/ci.yml .github/workflows/publish.yml
          shellcheck .github/scripts/*.sh

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml
          # Fail on any finding, including info and style.
          failure-threshold: style

  images:
    name: images (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # The default docker builder is used on purpose: child images build
      # FROM the locally loaded base image.
      - name: Build base
        run: docker build --tag workforce-images/base:ci images/base
      - name: Build python
        run: docker build --build-arg BASE_IMAGE=workforce-images/base:ci --tag workforce-images/python:ci images/python
      - name: Smoke test
        run: |
          .github/scripts/smoke.sh workforce-images/base:ci images/base/Dockerfile
          .github/scripts/smoke.sh workforce-images/python:ci images/base/Dockerfile images/python/Dockerfile
