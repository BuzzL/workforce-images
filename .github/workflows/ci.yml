name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests (offline)
        run: python3 -m unittest discover -s scripts -v
      # Live check that every vendor source still answers in the expected
      # format. Proposes nothing and writes nothing.
      - name: Dry run against live sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/bump_pins.py --list --min-age-days 7

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml
          # Fail on any finding, including info and style.
          failure-threshold: style

  images:
    name: images (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # The default docker builder is used on purpose: child images build
      # FROM the locally loaded base image.
      - name: Build base
        run: docker build --tag workforce-images/base:ci images/base
      - name: Build python
        run: docker build --build-arg BASE_IMAGE=workforce-images/base:ci --tag workforce-images/python:ci images/python
      - name: Smoke test
        run: |
          # smoke <image> <dockerfile>... : run each image's smoke test
          # with the expected versions taken from the Dockerfiles' ARGs.
          smoke() {
            local image=$1; shift
            local -a env=() mounts=() cmds=()
            for dockerfile in "$@"; do
              local dir; dir=$(dirname "$dockerfile"); local name; name=$(basename "$dir")
              mapfile -t -O "${#env[@]}" env < <(sed -nE 's/^ARG ([A-Z_]+_VERSION)=(.+)$/--env=\1=\2/p' "$dockerfile")
              mounts+=(-v "$PWD/$dir/smoke.sh:/smoke/$name.sh:ro")
              cmds+=("bash /smoke/$name.sh")
            done
            local joined; joined=$(printf '%s && ' "${cmds[@]}")
            docker run --rm "${env[@]}" "${mounts[@]}" "$image" bash -c "${joined% && }"
          }
          smoke workforce-images/base:ci images/base/Dockerfile
          smoke workforce-images/python:ci images/base/Dockerfile images/python/Dockerfile
